name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  # 1. TEST (Тестирование)
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Скачиваем код
        uses: actions/checkout@v4

      - name: Устанавливаем Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Устанавливаем зависимости
        run: npm install

      - name: Запускаем тесты
        run: npm test

  # 2. BUILD (Сборка)
  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Скачиваем код
        uses: actions/checkout@v4

      - name: Тестовая сборка Docker-образа
        run: docker build -t my-app .

  # 3. PUBLISH (Публикация в GHCR)
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Скачиваем код
        uses: actions/checkout@v4

      - name: Авторизация в GitHub Packages (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Публикация образа
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:latest

  # 4. DEPLOY (Деплой)
  deploy:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Симуляция деплоя на сервер
        run: |
          echo "Подключаемся к серверу..."
          echo "Скачиваем новый образ ghcr.io/${{ github.repository }}:latest"
          echo "Перезапускаем контейнер..."
          echo "Деплой успешно завершён!"